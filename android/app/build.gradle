plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.twiliovoice'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.twiliovoice"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'com.twilio') {
                    if (details.requested.name.contains('shared-internal') ||
                            details.requested.name.contains('shared-public') ||
                            details.requested.name.contains('twilsock')) {
                        details.useVersion '+'
                    }
                }
            }
        }
    }
}

dependencies {
    // Twilio Voice SDK
    implementation 'com.twilio:sync-android:3.0.3'
    implementation 'com.twilio:voice-android:6.10.3'



    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // Networking (OkHttp + Gson)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  
}

configurations.all {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'com.twilio') {
                if (details.requested.name.contains('shared-internal') ||
                        details.requested.name.contains('shared-public') ||
                        details.requested.name.contains('twilsock')) {
                    details.useVersion '+'
                }
            }
        }
    }
}

